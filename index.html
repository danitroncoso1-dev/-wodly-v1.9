<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WODLY</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #111;
      color: white;
      min-height: 100vh;
    }

    header {
      background: #1b1b1b;
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid #333;
    }

    .logo {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 3px;
    }

    .subtitle {
      color: #aaa;
      margin-top: 5px;
      font-size: 14px;
      letter-spacing: 2px;
    }

    main {
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }

    .welcome {
      margin: 10px 0 25px;
    }

    .welcome h1 {
      font-size: 28px;
      margin-bottom: 6px;
    }

    .welcome p {
      color: #aaa;
    }

    .card {
      background: #1d1d1d;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid #303030;
      box-shadow: 0 5px 15px rgba(0,0,0,0.25);
    }

    .card h2 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .wod {
      border-left: 5px solid #fff;
    }

    .wod-title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .wod p {
      color: #ccc;
      line-height: 1.5;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    button {
      border: none;
      padding: 16px 10px;
      border-radius: 12px;
      background: #292929;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #3a3a3a;
    }

    .primary {
      background: white;
      color: #111;
    }

    .primary:hover {
      background: #ddd;
    }

    footer {
      text-align: center;
      color: #666;
      padding: 25px 10px;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">WODLY</div>
    <div class="subtitle">CROSSFIT MANAGEMENT</div>
  </header>

  <main>

    <section class="welcome">
      <h1>Bienvenido a WODLY</h1>
      <p>La gestión de tu box, en un solo lugar.</p>
    </section>

    <section class="card wod">
      <h2>🔥 WOD DEL DÍA</h2>

      <div class="wod-title">AMRAP 15'</div>

      <p>
        10 Burpees<br>
        15 Kettlebell Swings<br>
        20 Air Squats
      </p>
    </section>

    <section class="card">
      <h2>📊 Resumen del Box</h2>

      <p style="color:#aaa; line-height:1.8;">
        👥 Socios activos: <strong style="color:white;">0</strong><br>
        📅 Clases de hoy: <strong style="color:white;">0</strong><br>
        💳 Cuotas pendientes: <strong style="color:white;">0</strong>
      </p>
    </section>

    <div class="buttons">
      <button class="primary" onclick="alert('Próximamente: gestión de socios')">
        👥 SOCIOS
      </button>

      <button onclick="alert('Próximamente: gestión de clases')">
        📅 CLASES
      </button>

      <button onclick="alert('Próximamente: gestión de pagos')">
        💳 PAGOS
      </button>

      <button onclick="alert('Próximamente: estadísticas')">
        📊 ESTADÍSTICAS
      </button>
    </div>

  </main>

  <footer>
    WODLY © 2026 · CrossFit Management
  </footer>

</body>
</html>
